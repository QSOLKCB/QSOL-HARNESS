[workspace]
resolver = "2"
members = ["runtime"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
